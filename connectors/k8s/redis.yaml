# In-cluster Redis for the connectors service. Required because the app runs
# multiple replicas + a durable ride tracker and must share session/token/
# ride-registry state across pods (see k8s/configmap.yaml REDIS_URL).
#
# ⚠️ Durability: this is a single-replica, NON-persistent Redis (no AOF, no PVC).
# It fixes the cross-pod split-brain for the 2 app replicas, but if THIS Redis pod
# is rescheduled (node drain, eviction, OOM, upgrade) all in-flight state is lost —
# the ride tracker forgets active bookings and stops pushing arrived/started/ended
# updates for rides that were in progress. That's acceptable for the pilot, NOT for
# real production. For durability, point REDIS_URL at a managed Redis, or add a PVC
# + `--appendonly yes` here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ny-connectors-redis
  labels:
    app: ny-connectors-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ny-connectors-redis
  template:
    metadata:
      labels:
        app: ny-connectors-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]  # cache-style; state is reconstructible
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ny-connectors-redis
spec:
  selector:
    app: ny-connectors-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
