apiVersion: apps/v1
kind: Deployment
metadata:
  name: ny-connectors
  labels:
    app: ny-connectors
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ny-connectors
  template:
    metadata:
      labels:
        app: ny-connectors
    spec:
      containers:
        - name: ny-connectors
          # The image published by .github/workflows/connectors-ci.yml.
          # ⚠️ Pin to a specific sha-<gitsha> tag (from the CI "Pinnable image"
          # output) before a real rollout — :latest is a moving convenience tag
          # and defeats reproducible deploys / rollbacks.
          image: ghcr.io/nammayatri/ny-connectors:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ny-connectors-config
            - secretRef:
                name: ny-connectors-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
