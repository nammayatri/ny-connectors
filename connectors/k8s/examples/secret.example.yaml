# TEMPLATE ONLY — NOT an applyable manifest. It lives in k8s/examples/ (NOT k8s/)
# on purpose: it shares the real object name `ny-connectors-secrets`, so if it sat
# in k8s/ a directory-wide `kubectl apply -f k8s/` (or a GitOps sync) would overwrite
# the live credentials Secret with these REPLACE_ME values and take the service down.
#
# To use: copy this out, fill in real values, and apply the copy — or (simpler) create
# the Secret imperatively with `kubectl create secret generic ny-connectors-secrets
# --from-literal=...` (see README). The Deployment mounts it via `secretRef: ny-connectors-secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: ny-connectors-secrets
type: Opaque
stringData:
  # --- WhatsApp Cloud API (per-number; or use the MERCHANT_{ID}_* variants) ---
  WHATSAPP_VERIFY_TOKEN: "REPLACE_ME"
  WHATSAPP_APP_SECRET: "REPLACE_ME"      # verifies inbound webhook HMAC
  WHATSAPP_ACCESS_TOKEN: "REPLACE_ME"    # sends outbound messages
  WHATSAPP_PHONE_NUMBER_ID: "REPLACE_ME"
  # --- Namma Yatri API creds ---
  NY_PRE_AUTH_TOKEN: "REPLACE_ME"        # silent getToken auth for existing riders
  NY_MERCHANT_ID: "REPLACE_ME"
  NY_DASHBOARD_TOKEN: "REPLACE_ME"       # new-user OTP registration
  NY_CITY: "REPLACE_ME"                  # e.g. std:080 (Bengaluru) / the Tumkur city id
  # NOTE: NY_MOCK must be unset/absent in production — the app refuses to boot if
  # NY_MOCK is enabled while NODE_ENV=production.
